<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>HelpRest | Restaurantes Compatíveis com suas Restrições Alimentares</title>
    <meta
      name="description"
      content="HelpRest conecta pessoas com restrições alimentares — celíacos, intolerantes à lactose, veganos, vegetarianos e alérgicos — a restaurantes compatíveis com cardápios separados por perfil e avaliações validadas por GPS em 100m."
    />
    <meta
      name="keywords"
      content="restrições alimentares, sem glúten, vegano, sem lactose, celíaco, alergias alimentares, restaurantes seguros, HelpRest, cardápio seguro"
    />
    <meta name="theme-color" content="#009C9D" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://helprest.com/" />
    <meta property="og:title" content="HelpRest | Coma fora com tranquilidade e cardápios compatíveis" />
    <meta
      property="og:description"
      content="Filtre restaurantes por flags alimentares, veja pratos compatíveis separados no cardápio e confira avaliações validadas presencialmente em 100m."
    />
    <meta property="og:image" content="/assets/logos/helprest_logo_green.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="HelpRest | Coma fora com tranquilidade" />
    <meta
      property="twitter:description"
      content="Descubra restaurantes e pratos compatíveis com suas restrições alimentares perto de você."
    />
    <meta property="twitter:image" content="/assets/logos/helprest_logo_green.png" />

    <!-- Fonts matching helprest-app bundled locally via @fontsource -->
  </head>
  <body class="bg-[#FAFAFA] text-[#11181C] antialiased selection:bg-[#009C9D]/20 selection:text-[#007E7F] min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
